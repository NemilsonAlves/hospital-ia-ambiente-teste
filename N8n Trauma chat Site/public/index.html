<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Chat Trauma</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="preconnect" href="https://unpkg.com">
  <link href="https://cdn.jsdelivr.net/npm/@n8n/chat/dist/style.css" rel="stylesheet" />
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Cantarell,Noto Sans,sans-serif;margin:0;background:#0b141a;color:#e2e8f0}
    .whatsapp-header{background:#075E54;color:#fff;padding:12px 16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #064c45}
    .whatsapp-header .avatar{width:36px;height:36px;border-radius:50%;background:#25D366}
    .container{max-width:960px;margin:0 auto}
    #n8n-chat{height:calc(100vh - 64px);background:#0b141a}
    .card{background:#111827;border:1px solid #1f2937;border-radius:12px;padding:16px;max-width:960px;margin:16px auto}
    .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
    .btn{background:#25D366;color:#082e24;border:none;border-radius:20px;padding:10px 14px;cursor:pointer}
    .btn.secondary{background:#374151;color:#fff}
    .btn.danger{background:#d93025;color:#fff}
    input[type=file],input[type=text]{background:#0e1a22;color:#d1d5db;border:1px solid #1f2937;border-radius:20px;padding:10px;width:100%;max-width:360px}
    .status{margin-top:8px;font-size:14px;color:#9ca3af}
    .grid{display:grid;grid-template-columns:1fr;gap:12px}
    @media(min-width:760px){.grid{grid-template-columns:1fr 1fr}}
  </style>
  <script src="https://unpkg.com/@n8n/chat@latest"></script>
  <script defer src="./site.js"></script>
  <script>
    window.CHAT_WEBHOOK_URL = 'SUA_CHAT_URL_DO_N8N';
    window.UPLOAD_WEBHOOK_URL = 'SUA_WEBHOOK_URL_UPLOAD';
    window.VOICE_WEBHOOK_URL = 'SUA_WEBHOOK_URL_VOICE';
  </script>
  </head>
<body>
  <div class="whatsapp-header">
    <div class="avatar"></div>
    <div>
      <div style="font-weight:600">Assistente de Atendimento</div>
      <div style="font-size:12px;opacity:.85">Online</div>
    </div>
  </div>
  <div class="container">
    <div id="n8n-chat"></div>
  </div>
  <div class="card">
    <h3>Envio de arquivos e áudio</h3>
    <div class="grid">
      <div>
        <div class="row">
          <input id="sectorHint" type="text" placeholder="Setor (opcional)">
          <input id="fileInput" type="file" />
          <button id="uploadBtn" class="btn">Enviar</button>
        </div>
        <div id="uploadStatus" class="status"></div>
      </div>
      <div>
        <div class="row">
          <button id="startRecBtn" class="btn">Gravar</button>
          <button id="stopRecBtn" class="btn danger" disabled>Parar</button>
          <button id="clearRecBtn" class="btn secondary">Limpar</button>
        </div>
        <div id="voiceStatus" class="status"></div>
        <audio id="audioPreview" controls style="margin-top:8px;width:100%"></audio>
      </div>
    </div>
  </div>
</body>
</html>
