<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grapeGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#9C27B0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7B1FA2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grapeLeafGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#66BB6A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#43A047;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Shadow -->
  <ellipse cx="24" cy="42" rx="9" ry="2.5" fill="black" opacity="0.15"/>
  
  <!-- Grapes cluster -->
  <circle cx="24" cy="27" r="5.5" fill="url(#grapeGradient)" stroke="#6A1B9A" stroke-width="0.5"/>
  <circle cx="18" cy="24" r="4.5" fill="url(#grapeGradient)" stroke="#6A1B9A" stroke-width="0.5"/>
  <circle cx="30" cy="24" r="4.5" fill="url(#grapeGradient)" stroke="#6A1B9A" stroke-width="0.5"/>
  <circle cx="21" cy="19" r="4.2" fill="url(#grapeGradient)" stroke="#6A1B9A" stroke-width="0.5"/>
  <circle cx="27" cy="19" r="4.2" fill="url(#grapeGradient)" stroke="#6A1B9A" stroke-width="0.5"/>
  <circle cx="24" cy="16" r="4" fill="url(#grapeGradient)" stroke="#6A1B9A" stroke-width="0.5"/>
  
  <!-- Highlights on grapes -->
  <ellipse cx="22" cy="15" rx="1.5" ry="2" fill="white" opacity="0.4"/>
  <ellipse cx="19" cy="22" rx="1.2" ry="1.5" fill="white" opacity="0.3"/>
  <ellipse cx="28" cy="22" rx="1.2" ry="1.5" fill="white" opacity="0.3"/>
  
  <!-- Stem -->
  <rect x="23" y="9" width="2" height="7" fill="#8D6E63" rx="1"/>
  
  <!-- Leaf -->
  <path d="M24 12C24 12 26 9 28.5 9C31 9 32 9.8 32 11C32 12.5 31 13.5 28.5 13.5C26 13.5 24 12 24 12Z" 
        fill="url(#grapeLeafGradient)" 
        stroke="#2E7D32" 
        stroke-width="0.5"/>
</svg>
