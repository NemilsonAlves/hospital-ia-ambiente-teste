<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="kiwiGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#AED581;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7CB342;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Shadow -->
  <ellipse cx="24" cy="42" rx="9" ry="2.5" fill="black" opacity="0.15"/>
  
  <!-- Kiwi outer (brown fuzzy skin) -->
  <ellipse cx="24" cy="24" rx="11" ry="10" fill="#8D6E63" stroke="#6D4C41" stroke-width="0.8"/>
  
  <!-- Fuzzy texture -->
  <circle cx="18" cy="20" r="0.5" fill="#6D4C41" opacity="0.4"/>
  <circle cx="22" cy="18" r="0.5" fill="#6D4C41" opacity="0.4"/>
  <circle cx="26" cy="19" r="0.5" fill="#6D4C41" opacity="0.4"/>
  <circle cx="30" cy="22" r="0.5" fill="#6D4C41" opacity="0.4"/>
  <circle cx="20" cy="26" r="0.5" fill="#6D4C41" opacity="0.4"/>
  <circle cx="28" cy="27" r="0.5" fill="#6D4C41" opacity="0.4"/>
  <circle cx="24" cy="29" r="0.5" fill="#6D4C41" opacity="0.4"/>
  
  <!-- Kiwi slice (green flesh) -->
  <ellipse cx="24" cy="24" rx="8" ry="7" fill="url(#kiwiGradient)"/>
  
  <!-- White center -->
  <ellipse cx="24" cy="24" rx="3" ry="2.5" fill="#F5F5F5"/>
  
  <!-- Seeds pattern -->
  <ellipse cx="24" cy="22" rx="0.4" ry="0.6" fill="#1A1A1A" opacity="0.6"/>
  <ellipse cx="22" cy="24" rx="0.4" ry="0.6" fill="#1A1A1A" opacity="0.6"/>
  <ellipse cx="26" cy="24" rx="0.4" ry="0.6" fill="#1A1A1A" opacity="0.6"/>
  <ellipse cx="24" cy="26" rx="0.4" ry="0.6" fill="#1A1A1A" opacity="0.6"/>
  <ellipse cx="23" cy="23" rx="0.4" ry="0.6" fill="#1A1A1A" opacity="0.6"/>
  <ellipse cx="25" cy="23" rx="0.4" ry="0.6" fill="#1A1A1A" opacity="0.6"/>
  <ellipse cx="23" cy="25" rx="0.4" ry="0.6" fill="#1A1A1A" opacity="0.6"/>
  <ellipse cx="25" cy="25" rx="0.4" ry="0.6" fill="#1A1A1A" opacity="0.6"/>
  
  <!-- Highlight -->
  <ellipse cx="20" cy="20" rx="2" ry="2.5" fill="white" opacity="0.3"/>
