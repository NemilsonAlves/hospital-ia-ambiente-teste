        stroke="#43A047" 
        stroke-width="3" 
        fill="none"/>
  
  <!-- Red flesh -->
  <path d="M14 24C14 18.5 18.5 14 24 14C29.5 14 34 18.5 34 24L14 24Z" 
        fill="url(#watermelonGradient)"/>
  
  <!-- Seeds -->
  <ellipse cx="20" cy="20" rx="1" ry="1.5" fill="#1A1A1A" opacity="0.8"/>
  <ellipse cx="24" cy="18" rx="1" ry="1.5" fill="#1A1A1A" opacity="0.8"/>
  <ellipse cx="28" cy="20" rx="1" ry="1.5" fill="#1A1A1A" opacity="0.8"/>
  <ellipse cx="22" cy="22" rx="1" ry="1.5" fill="#1A1A1A" opacity="0.8"/>
  <ellipse cx="26" cy="22" rx="1" ry="1.5" fill="#1A1A1A" opacity="0.8"/>
  
  <!-- Highlight -->
