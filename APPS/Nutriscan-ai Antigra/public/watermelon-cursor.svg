<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="watermelonGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B6B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E53935;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Shadow -->
  <ellipse cx="24" cy="42" rx="11" ry="2.5" fill="black" opacity="0.15"/>
  
  <!-- Watermelon slice (semicircle) -->
  <path d="M12 24C12 17 17 12 24 12C31 12 36 17 36 24C36 31 31 36 24 36C17 36 12 31 12 24Z" 
