<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="appleGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B6B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E74C3C;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="leafGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#52C41A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#27AE60;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Shadow -->
  <ellipse cx="24" cy="42" rx="10" ry="2.5" fill="black" opacity="0.15"/>
  
  <!-- Apple body with gradient -->
  <path d="M24 10C18 10 13.5 15 13.5 21.5C13.5 28.5 16.5 35 24 38C31.5 35 34.5 28.5 34.5 21.5C34.5 15 30 10 24 10Z" 
        fill="url(#appleGradient)" 
        stroke="#C0392B" 
        stroke-width="0.8"/>
  
  <!-- Highlight shine -->
  <ellipse cx="18.5" cy="19" rx="4" ry="5.5" fill="white" opacity="0.4"/>
  <ellipse cx="17" cy="17" rx="2.5" ry="3.5" fill="white" opacity="0.6"/>
  
  <!-- Stem -->
  <rect x="22.8" y="7" width="2.4" height="5" fill="#6D4C41" rx="1.2"/>
  
  <!-- Leaf with gradient -->
  <path d="M24.5 9C24.5 9 26 6.5 28.5 6.5C31 6.5 32.5 7.8 32.5 9.3C32.5 10.8 31 12 28.5 12C26 12 24.5 9.5 24.5 9Z" 
        fill="url(#leafGradient)" 
        stroke="#1E8449" 
        stroke-width="0.5"/>
  
  <!-- Leaf vein detail -->
  <path d="M28.5 8C28.5 8 29.5 9 29.5 10.5" stroke="#1E8449" stroke-width="0.5" opacity="0.5" fill="none"/>
</svg>
